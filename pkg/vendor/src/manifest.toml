kind = "metal-vulkan-icd-source"
role = "source-mirror"
upstream = "https://github.com/KhronosGroup/MoltenVK.git"
release_tag = "v1.4.2"
commit = "db66022459ffb663aa2b50f6b018bc2e124f5edf"
