schema_version = 1
catalogue = "rosette-vendored-library-catalogue"
source_root = "../sources"
target_root = ".."
source_hash_algorithm = "sha256(path-and-content-v1)"

# These are the facts that are allowed to be shared by every host route. The
# target.toml files below contain only ABI/provider choices for one
# architecture/platform pair; they deliberately do not repeat versions.
[matrix]
architectures = ["x86_64", "aarch64", "powerpc64"]
platforms = ["windows", "macOS", "linux"]
expected_target_count = 9

# Xenia's source dependency and runtime requirement are different contracts.
# It builds against the header snapshot below, starts instance negotiation at
# Vulkan 1.0, and requires only a Vulkan 1.0-capable runtime. A newer loader
# or ICD may be selected at runtime after capability negotiation.
[xenia]
vulkan_header_version = "1.4.313"
vulkan_header_commit = "409c16be502e39fe70dd6fe2d9ad4842ef2c9a53"
vulkan_instance_default_api = "1.0.0"
vulkan_runtime_minimum_api = "1.0.0"
sdl_version = "2.32.2"
vma_version = "3.2.1"
moltenvk_version = "1.4.2"
package_log = ".rosette/rosette-pkg.log"

[[libraries]]
id = "vulkan-headers"
version = "1.4.313"
kind = "header-source"
role = "build-time"
upstream = "https://github.com/KhronosGroup/Vulkan-Headers.git"
release_tag = "v1.4.313"
commit = "409c16be502e39fe70dd6fe2d9ad4842ef2c9a53"
xenia_submodule = "third_party/Vulkan-Headers"
source_dir = "sources/vulkan-headers/1.4.313"
source_tree_sha256 = "cec66cb2dace902ce889e24d8564e4bee3d59ab5c651f6f1f7ab5c03d7d2b76b"
license_file = "LICENSE.md"

[[libraries]]
id = "vulkan-loader"
version = "1.4.313"
kind = "runtime-loader-source"
role = "source-mirror"
upstream = "https://github.com/KhronosGroup/Vulkan-Loader.git"
release_tag = "v1.4.313"
commit = "fb78607414e154c7a5c01b23177ba719c8a44909"
xenia_submodule = ""
source_dir = "sources/vulkan-loader/1.4.313"
source_tree_sha256 = "e84b25f900797590568fb71fa830cfcc28d4556e0cf07c844cee363767ff7a9e"
license_file = "LICENSE.txt"

[[libraries]]
id = "moltenvk"
